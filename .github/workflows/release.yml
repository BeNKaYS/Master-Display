name: Release & Build Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Pillow (for installer asset generation)
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Build Application & Inno Setup Installer
        shell: powershell
        run: |
          .\Setup_Olustur.ps1

      - name: Create GitHub Release and Upload Installer
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Setup/Master-Display_Kurulum_Setup.exe
          generate_release_notes: true
          draft: false
          prerelease: false
