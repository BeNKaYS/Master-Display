[package]
name = "master-display"
version = "2.0.0"
description = "Tören ve Sahne Sunum Yönetim Uygulaması (Ceremony & Stage Presentation Manager)"
authors = ["Master-Display"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "master_display_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true
